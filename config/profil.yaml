# Schwellenwerte
schwellen:
  vorfilter_min: 3        # Mindestpunktzahl, damit ein Treffer ans Sprachmodell geht
  passung_melden: 60      # ab dieser Passung (0 bis 100) wird ein Treffer gemeldet
  erinnerung_tage: [14, 7, 3]   # Fristerinnerungen so viele Tage vor Abgabe
