  - evaluation
  - studie
  - analyse
  - befragung
  - begleitung
  - moderation
  - workshop
  - weiterbildung
  - schulung
  - konzept
  - grundlagen

# CPV-Codes (EU-Klassifikation), die typisch für IOL-Leistungen sind.
# Abgleich erfolgt über den Anfang des Codes (Präfix).
