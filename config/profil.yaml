# Institutsprofil IOL (OST)
# Diese Datei steuert, was als "passend" gilt. Sie ist der wichtigste Hebel für
# die Qualität der Treffer. Pflegen Sie sie gemeinsam im Team.

institut:
  name: "IOL Institut für Organisation und Leadership, OST Ostschweizer Fachhochschule"
  kurzbeschreibung: >
    Angewandte Forschung, Beratung und Weiterbildung zu Führung, Human Resources,
    Organisationsentwicklung, digitaler Transformation und KI sowie
    Nachhaltigkeitsmanagement. Typische Leistungen sind Beratungsmandate,
    Evaluationen, Studien, Befragungen, Workshops, Moderation von
    Veränderungsprozessen, Weiterbildungen und angewandte Forschungsprojekte.
  standort: "Ostschweiz (St. Gallen)"
  bevorzugte_kantone: ["SG", "TG", "AR", "AI", "GR", "ZH", "SH", "GL"]

# Kernthemen mit Suchbegriffen für den Vorfilter.
