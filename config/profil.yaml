# Zuordnung der Kernthemen zu den Kompetenzzentren. Die App zeigt die
# Empfehlungen getrennt nach diesen Zentren. Namen und Zuordnung bitte an die
# offizielle Struktur des IOL anpassen. Die Themen müssen exakt den Namen unter
# "kernthemen" entsprechen. Ein Treffer kann in beiden Zentren erscheinen.
kompetenzzentren:
  Kompetenzzentrum Organisation und Nachhaltigkeit:
    beschreibung: "Organisationsentwicklung, digitale Transformation und KI, Nachhaltigkeitsmanagement"
    themen:
      - Organisationsentwicklung
      - Digitale Transformation und KI
      - Nachhaltigkeit und Kreislaufwirtschaft
  Kompetenzzentrum Leadership und HR:
    beschreibung: "Führung, Governance, Personalentwicklung und Personalauswahl, Arbeitsgestaltung und Work-Life-Balance"
    themen:
      - Leadership und Führung
      - Governance
      - Human Resources
      - Arbeitsgestaltung und Work-Life-Balance

# Begriffe, die auf eine Beratungs-, Studien- oder Evaluationsleistung hinweisen.
# Sie erhöhen den Vorfilter-Score leicht, reichen allein aber nicht aus.
